[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rmt-continual-learning"
version = "0.1.0"
description = "A reproducible benchmark for continual LoRA fine-tuning under limited compute"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "Mirzanov Temirlan"},
  {name = "Turemuratov Galymzhan"},
  {name = "Abdikul Bakdaulet"},
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
experiment = [
  "torch>=2.2",
  "transformers>=4.45,<5",
  "peft>=0.13",
  "datasets>=3,<6",
  "accelerate>=1.0",
]
reporting = ["matplotlib>=3.8"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.8"]

[project.scripts]
rmt = "rmt.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]


