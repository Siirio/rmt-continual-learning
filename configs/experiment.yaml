project_name: rmt-continual-learning
data_seed: 1234
main_seeds: [0, 1, 2]
calibration_seed: 1000
task_order: [ag_news, sst2, emotion]
dataset_path: data/processed/assignment4_real_6000.csv
manifest_path: data/manifests/assignment4_dataset_manifest.json
output_dir: results/raw
checkpoint_dir: checkpoints
resume: true
fail_fast: false
training:
  optimizer: AdamW
  learning_rate: 0.0002
  weight_decay: 0.0
  epochs_per_task: 2
  effective_batch_size: 16
  warmup_ratio: 0.1
  gradient_clip_norm: 1.0
run_plan:
  main_methods: [sequential_lora, experience_replay, ewc, joint_training]
  ewc_calibration_values: [0.01, 0.1, 1.0, 10.0, 100.0]
  replay_sensitivity_values: [0.05, 0.20]

